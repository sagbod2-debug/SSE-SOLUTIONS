[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Clean URL redirects without .html
[[redirects]]
  from = "/cc-care.html"
  to = "/cc-care"
  status = 301

[[redirects]]
  from = "/cc-care/autonomie-inclusion.html"
  to = "/cc-care/autonomie-inclusion"
  status = 301

[[redirects]]
  from = "/cc-consulting.html"
  to = "/cc-consulting"
  status = 301

[[redirects]]
  from = "/cc-events.html"
  to = "/cc-events"
  status = 301

[[redirects]]
  from = "/contact.html"
